workflows:
  ios-workflow:
    name: iOS
    max_build_duration: 60
    instance_type: mac_mini_m1

    #    triggering:
    #      events: # List the events that trigger builds
    #        - tag
    #      branch_patterns: # Include or exclude watched branches
    #        - pattern: 'master'
    #          include: true
    #          source: true

    environment:
      ios_signing:
        provisioning_profiles:
        - io.github.maocypher.dogsportsdiary-mobileprovision
        certificates:
        - io.github.maocypher.dogsportsdiary-p12-ios
      vars:
        PACKAGE_NAME: "io.github.maocypher.dogsportsdiary"
        APP_ID: HSP6K6D926.io.github.maocypher.dogsportsdiary
      flutter: 3.27.2

    integrations:
      app_store_connect: codemagic-integration-apple-developer-portal

    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter analyze
        script: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter unit tests
        script: |
          flutter test
        ignore_failure: true

      - name: Check code signing
        script: |
          ls -la /Users/builder/Library/MobileDevice/Provisioning\ Profiles/
          security find-identity -v -p codesigning
          flutter doctor -v

      - name: Setup project in Xcode with signing
        script: |
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Flutter build simulator debug version
        script: |
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}')
          BUILD_NAME=$(echo $VERSION | cut -d+ -f1)
          BUILD_NUMBER=$(echo $VERSION | cut -d+ -f2)
          flutter build ios --debug --no-codesign \
            --simulator \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER
      - name: Rename the debug simulator file
        script: |
          mv build/ios/iphonesimulator/Runner.app \
            build/ios/iphonesimulator/Runner-debug-simulator.app

      - name: Build IPA for App Store
        script: |
          if [[ "$CM_BRANCH" == "master" ]]; then
            echo "Building IPA for App Store (master branch)"
            VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}')
            BUILD_NAME=$(echo $VERSION | cut -d+ -f1)
            BUILD_NUMBER=$(echo $VERSION | cut -d+ -f2)
            flutter build ipa \
              --release \
              --build-name=$BUILD_NAME \
              --build-number=$BUILD_NUMBER \
              --export-options-plist=/Users/builder/export_options.plist
          else
            echo "Skipping IPA build for non-master branch: $CM_BRANCH"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/*/*.app
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - maocypher@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
#        submit_to_testflight: true
#        submit_to_app_store: false
#        beta_groups:
#          - "beta"
  fdroid-reproducible-workflow:
    name: Fdroid
    max_build_duration: 90
    instance_type: mac_mini_m1

  #  triggering:
  #    events:
  #      - tag
  #    branch_patterns:
  #      - pattern: 'master'
  #        include: true
  #        source: true

    environment:
      groups:
        - github_credentials
      vars:
        PACKAGE_NAME: "io.github.maocypher.dogsportsdiary"
        BUILD_TOOLS_VERSION: "31.0.0"
        NDK_VERSION: "27.2.12479018"
        JAVA_VERSION: "17"
        GRADLE_VERSION: "8.11.1"
        FDROID_DATA_REPO: "https://gitlab.com/fdroid/fdroiddata.git"
        APP_FDROID_ID: "io.github.maocypher.dogsportsdiary"
      flutter: 3.27.2

    scripts:
      - name: Setup Java and Gradle versions
        script: |
          # Install specific OpenJDK version if not available
          echo "Setting up OpenJDK $JAVA_VERSION on macOS"
          
          # Check available Java installations on macOS
          /usr/libexec/java_home -V
          
          # Install Java using Homebrew if not available
          if ! /usr/libexec/java_home -v $JAVA_VERSION >/dev/null 2>&1; then
            echo "Installing OpenJDK $JAVA_VERSION"
            brew install openjdk@$JAVA_VERSION
          fi
          
          # Set JAVA_HOME using macOS java_home utility
          export JAVA_HOME=$(/usr/libexec/java_home -v $JAVA_VERSION)
          export PATH=$JAVA_HOME/bin:$PATH
          
          # Persist for all subsequent steps
          echo "export JAVA_HOME=$JAVA_HOME" >> $CM_ENV
          echo "export PATH=$JAVA_HOME/bin:\$PATH" >> $CM_ENV
          
          echo "JAVA_HOME set to: $JAVA_HOME"
          java -version
          
          flutter config --jdk-dir=$JAVA_HOME
          
          # Install specific Gradle version
          echo "Installing Gradle $GRADLE_VERSION"
          wget https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip
          unzip -q gradle-$GRADLE_VERSION-bin.zip
          export GRADLE_HOME=$PWD/gradle-$GRADLE_VERSION
          export PATH=$GRADLE_HOME/bin:$PATH
          
          # Persist Gradle path
          echo "export GRADLE_HOME=$PWD/gradle-$GRADLE_VERSION" >> $CM_ENV
          echo "export PATH=$PWD/gradle-$GRADLE_VERSION/bin:\$PATH" >> $CM_ENV
          
          gradle --version
          
          # Update gradle wrapper to use specific version
          cd android
          ./gradlew wrapper --gradle-version=$GRADLE_VERSION
          cd ..

      - name: Install F-Droid tools
        script: |
          # Install fdroidserver
          pip3 install fdroidserver
          
          # Verify installation
          fdroid --version

      - name: Clone F-Droid data repository
        script: |
          # Clone fdroiddata repository
          git clone $FDROID_DATA_REPO fdroiddata
          cd fdroiddata

      - name: Get app version and commit info
        script: |
          # Get version from pubspec.yaml
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}')
          BUILD_NAME=$(echo $VERSION | cut -d+ -f1)
          BUILD_NUMBER=$(echo $VERSION | cut -d+ -f2)
          
          # Get current commit hash
          COMMIT_HASH=$(git rev-parse HEAD)
          
          # Export for use in other steps
          echo "BUILD_NAME=$BUILD_NAME" >> $CM_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
          echo "COMMIT_HASH=$COMMIT_HASH" >> $CM_ENV
          
          echo "App Version: $BUILD_NAME"
          echo "Version Code: $BUILD_NUMBER"
          echo "Commit Hash: $COMMIT_HASH"

      - name: Update F-Droid metadata
        script: |
          cd fdroiddata
          
          # Create metadata directory if it doesn't exist
          mkdir -p metadata/$APP_FDROID_ID
          
          # Create or update the fdroid.yml file
          cat > metadata/$APP_FDROID_ID.yml << EOF
          Categories:
            - Sports & Health
          License: AGPL-3.0-or-later
          AuthorName: Ann-Jacqueline Lange
          AuthorEmail: maocypher@gmail.com
          WebSite: https://dgsptdry.uber.space/
          SourceCode: https://github.com/maocypher/dogsportsdiary
          IssueTracker: https://github.com/maocypher/dogsportsdiary/issues
          
          AutoName: Dog Sports Diary
          
          RepoType: git
          Repo: https://github.com/maocypher/dogsportsdiary.git
          Binaries: https://github.com/maocypher/dogsportsdiary/releases/download/%v-alpha/io.github.maocypher.dogsportsdiary_%c.apk
          
          Builds:
            - versionName: $BUILD_NAME
              versionCode: $BUILD_NUMBER
              commit: $COMMIT_HASH
              submodules: true
              output: build/app/outputs/flutter-apk/app-release.apk
              rm:
                - ios
                - web
              prebuild:
                - cd ..
                - mv io.github.maocypher.dogsportsdiary /tmp/build
                - pushd /tmp/build
                - export PUB_CACHE=$(pwd)/.pub-cache
                - rm .flutter/dev/integration_tests/module_host_with_custom_build/.gradle/6.3/fileChanges/last-build.bin
                - .flutter/bin/flutter config --no-analytics
                - .flutter/bin/flutter pub get
                - popd
                - mv /tmp/build io.github.maocypher.dogsportsdiary
              scanignore:
                - .flutter/bin/cache
              scandelete:
                - .flutter
                - .pub-cache
              build:
                - cd ..
                - mv io.github.maocypher.dogsportsdiary /tmp/build
                - pushd /tmp/build
                - export PUB_CACHE=$(pwd)/.pub-cache
                - .flutter/bin/flutter build apk --release
                - popd
                - mv /tmp/build io.github.maocypher.dogsportsdiary
              ndk: $NDK_VERSION
                    
          AllowedAPKSigningKeys: 30e6a93271004112891a28ace5bc08b10b2b65a291883a29f88fe009935e2e62
  
          AutoUpdateMode: Version
          UpdateCheckMode: Tags
          UpdateCheckData: pubspec.yaml|version:\s.*\+(\d+)|.|version:\s(.*)\+
          CurrentVersion: $BUILD_NAME
          EOF
          
          echo "F-Droid metadata updated for version $BUILD_NAME ($BUILD_NUMBER)"
          cat metadata/$APP_FDROID_ID.yml
          

      - name: Build with fdroid server
        script: |
          # Navigate to
          cd fdroiddata

          # Make sure there is no apk in github yet
          # e.g. fdroid build io.github.maocypher.dogsportsdiary:12
          fdroid build io.github.maocypher.dogsportsdiary:$BUILD_NUMBER
          
          mv unsigned/io.github.maocypher.dogsportsdiary_$BUILD_NUMBER.apk unsigned/io.github.maocypher.dogsportsdiary_$BUILD_NUMBER_unsigned.apk 

      - name: sign apk
        script: |
          cd fdroiddata/unsigned
          $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner sign \
            --ks $CM_KEYSTORE_PATH \
            --ks-key-alias $CM_KEY_ALIAS \
            --ks-pass pass:$CM_KEYSTORE_PASSWORD \
            --key-pass pass:$CM_KEY_PASSWORD \
            --out io.github.maocypher.dogsportsdiary_${BUILD_NUMBER}.apk \
            io.github.maocypher.dogsportsdiary_$BUILD_NUMBER_unsigned.apk
    artifacts:
      - fdroiddata/**/*.apk
  android-release-workflow:
    name: Android
    max_build_duration: 60
    instance_type: mac_mini_m1

#    triggering:
#      events: # List the events that trigger builds
#        - tag
#      branch_patterns: # Include or exclude watched branches
#        - pattern: 'master'
#          include: true
#          source: true

    environment:
      android_signing:
        - dogsportsdiary_signature
        #- keystore_reference
      groups:
        - google_credentials
        - github_credentials
      vars:
        PACKAGE_NAME: "io.github.maocypher.dogsportsdiary"
        GOOGLE_PLAY_TRACK: alpha
        BUILD_TOOLS_VERSION: "31.0.0"
        NDK_VERSION: "27.2.12479018"
        JAVA_VERSION: "17"
        GRADLE_VERSION: "8.11.1"
      flutter: 3.27.2

    scripts:
      - name: Setup Java and Gradle versions
        script: |
          # Install specific OpenJDK version if not available
          echo "Setting up OpenJDK $JAVA_VERSION on macOS"

          # Check available Java installations on macOS
          /usr/libexec/java_home -V

          # Install Java using Homebrew if not available
          if ! /usr/libexec/java_home -v $JAVA_VERSION >/dev/null 2>&1; then
            echo "Installing OpenJDK $JAVA_VERSION"
            brew install openjdk@$JAVA_VERSION
          fi

          # Set JAVA_HOME using macOS java_home utility
          export JAVA_HOME=$(/usr/libexec/java_home -v $JAVA_VERSION)
          export PATH=$JAVA_HOME/bin:$PATH

          # Persist for all subsequent steps
          echo "export JAVA_HOME=$JAVA_HOME" >> $CM_ENV
          echo "export PATH=$JAVA_HOME/bin:\$PATH" >> $CM_ENV

          echo "JAVA_HOME set to: $JAVA_HOME"
          java -version

          flutter config --jdk-dir=$JAVA_HOME

          # Install specific Gradle version
          echo "Installing Gradle $GRADLE_VERSION"
          wget https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip
          unzip -q gradle-$GRADLE_VERSION-bin.zip
          export GRADLE_HOME=$PWD/gradle-$GRADLE_VERSION
          export PATH=$GRADLE_HOME/bin:$PATH

          # Persist Gradle path
          echo "export GRADLE_HOME=$PWD/gradle-$GRADLE_VERSION" >> $CM_ENV
          echo "export PATH=$PWD/gradle-$GRADLE_VERSION/bin:\$PATH" >> $CM_ENV

          gradle --version

          # Update gradle wrapper to use specific version
          cd android
          ./gradlew wrapper --gradle-version=$GRADLE_VERSION
          cd ..
      - name: Check tools
        script: |
          echo "Build tools version: $BUILD_TOOLS_VERSION"
          echo "Java version:"
          java -version
          echo "Gradle version:"
          gradle --version
          $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner --version
          
          flutter doctor -v
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Flutter analyze
        script: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK with Flutter
        script: |
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}')
          BUILD_NAME=$(echo $VERSION | cut -d+ -f1)
          BUILD_NUMBER=$(echo $VERSION | cut -d+ -f2)
          flutter build apk --release \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER
      - name: Sign apk for reproducible build
        script: |
          # Get the actual APK path
          APK_PATH=$(find build/app/outputs/flutter-apk -name "app-release.apk" | head -1)

          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found"
            exit 1
          fi

          echo "Signing APK: $APK_PATH"

          # Sign the APK using Codemagic's keystore (not local path)
          $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner sign \
            --ks $CM_KEYSTORE_PATH \
            --ks-key-alias $CM_KEY_ALIAS \
            --ks-pass pass:$CM_KEYSTORE_PASSWORD \
            --key-pass pass:$CM_KEY_PASSWORD \
            --out build/app/outputs/flutter-apk/app-release-signed.apk \
            $APK_PATH

          # Verify the signature
          $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner verify \
            build/app/outputs/flutter-apk/app-release-signed.apk

    artifacts:
    - build/**/outputs/**/*.apk
    - build/**/outputs/**/*.aab
    - build/**/outputs/**/mapping.txt
    - flutter_drive.log

